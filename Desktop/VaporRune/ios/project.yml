name: VaporRune
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    ARCHS: arm64
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  VaporRune:
    type: application
    platform: iOS
    sources:
      - Sources
    preBuildScripts:
      - name: Build Rune
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vapor.rune-ios
        PRODUCT_NAME: Vapor
        SWIFT_OBJC_BRIDGING_HEADER: Sources/VaporBridge.h
        LIBRARY_SEARCH_PATHS: $(inherited) "$(DERIVED_FILE_DIR)"
        OTHER_LDFLAGS: $(inherited) -lvapor_rune -framework AVFoundation -framework AudioToolbox -framework CoreAudio -framework CoreFoundation -framework CoreGraphics -framework CoreMedia -framework CoreText -framework CoreVideo -framework Foundation -framework IOSurface -framework Metal -framework QuartzCore -framework Security -framework UIKit -lobjc -liconv
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Vapor
        NSMicrophoneUsageDescription: Vapor uses your microphone to capture audio recordings.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  VaporRuneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: VaporRune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vapor.rune-ios.uitests
        PRODUCT_NAME: VaporRuneUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VaporRune:
    build:
      targets:
        VaporRune: all
    test:
      targets:
        - VaporRuneUITests
