[package]
name = "vapor-rune"
version = "0.1.0"
edition = "2024"
publish = false

[features]
hot = ["rune/hot"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "f3160022ede63bca8354c1c85e5e4d3ab54937cb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.rune-hot]
inherits = "dev"
incremental = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSBitmapImageRep", "NSColor", "NSFontDescriptor", "NSImage", "NSImageRep", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSString"] }
