[package]
name = "vapor-rune"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
hot = ["rune/hot"]

[dependencies]
rune = { git = "https://github.com/bkase/rune", rev = "17b51e5a22dca39992ffdc9261829e263e7c6d7e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.rune-hot]
inherits = "dev"
incremental = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSBitmapImageRep", "NSColor", "NSFontDescriptor", "NSImage", "NSImageRep", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSString"] }

[target.'cfg(target_os = "ios")'.dependencies]
accesskit = "0.25.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
