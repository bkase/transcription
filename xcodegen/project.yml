name: Vapor
options:
  bundleIdPrefix: com.bkase.vapor
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    GENERATE_INFOPLIST_FILE: true
    ALWAYS_SEARCH_USER_PATHS: false
    ONLY_ACTIVE_ARCH: true
    SWIFT_EXPLICIT_MODULES: false
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

configFiles:
  Debug: configs/Debug.xcconfig
  Release: configs/Release.xcconfig

packages:
  # Point-Free - pinned to compatible versions
  swift-composable-architecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.23.0"
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.0.0"
  swift-tagged:
    url: https://github.com/pointfreeco/swift-tagged
    from: "0.10.0"
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: "1.10.0"
  swift-identified-collections:
    url: https://github.com/pointfreeco/swift-identified-collections
    from: "1.0.0"
  swift-clocks:
    url: https://github.com/pointfreeco/swift-clocks
    from: "1.0.0"
  swift-url-routing:
    url: https://github.com/pointfreeco/swift-url-routing
    from: "0.6.0"
  swift-parsing:
    url: https://github.com/pointfreeco/swift-parsing
    from: "0.13.0"
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.15.0"
  swift-gen:
    url: https://github.com/pointfreeco/swift-gen
    from: "0.4.0"
  swift-case-paths:
    url: https://github.com/pointfreeco/swift-case-paths
    from: "1.7.0"
  swift-perception:
    url: https://github.com/pointfreeco/swift-perception
    from: "2.0.0"
  swift-custom-dump:
    url: https://github.com/pointfreeco/swift-custom-dump
    from: "1.3.0"
  # Database
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"
  # ML - FluidAudio SDK
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.10.0"
  # ZIP archive support
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.0"

targets:
  Vapor:
    type: application
    platform: iOS
    sources:
      - path: ../App/Sources
    settings:
      base:
        DEVELOPMENT_TEAM: Y4U5GF9JQQ
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-tagged
        product: Tagged
      - package: swift-dependencies
        product: Dependencies
      - package: swift-identified-collections
        product: IdentifiedCollections
      - package: swift-clocks
        product: Clocks
      - package: swift-url-routing
        product: URLRouting
      - package: swift-parsing
        product: Parsing
      - package: swift-case-paths
        product: CasePaths
      - package: swift-collections
        product: OrderedCollections
      - target: Models
      - target: Persistence
      - target: Audio
      - target: Processing
      - target: Export
      - target: Observability
      - target: Routing
      - target: DesignSystem
      - target: TimelineFeature
      - target: RecordingFeature
      - target: SessionDetailFeature
      - target: PeopleFeature
      - target: SpeakerPickerFeature
      - target: AudioPlayerFeature
      - target: ProfileFeature
      - target: PersonTimelineFeature
    settings:
      base:
        INFOPLIST_FILE: ../App/Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bkase.vapor.app
        PRODUCT_NAME: Vapor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  # Core packages
  Models:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Core/Models/Sources/Models
    dependencies:
      - package: swift-tagged
        product: Tagged
    settings:
      base:
        PRODUCT_NAME: Models
        PRODUCT_MODULE_NAME: Models
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  Persistence:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Core/Persistence/Sources/Persistence
    dependencies:
      - target: Models
      - package: swift-tagged
        product: Tagged
      - package: swift-dependencies
        product: Dependencies
      - package: swift-dependencies
        product: DependenciesMacros
      - package: GRDB.swift
        product: GRDB
    settings:
      base:
        PRODUCT_NAME: Persistence
        PRODUCT_MODULE_NAME: Persistence
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  Audio:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Core/Audio/Sources/Audio
    dependencies:
      - target: Models
      - package: swift-tagged
        product: Tagged
      - package: swift-dependencies
        product: Dependencies
      - package: swift-dependencies
        product: DependenciesMacros
    settings:
      base:
        PRODUCT_NAME: Audio
        PRODUCT_MODULE_NAME: Audio
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  Processing:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Core/Processing/Sources/Processing
    dependencies:
      - target: Models
      - target: Audio
      - target: Persistence
      - target: Observability
      - package: swift-tagged
        product: Tagged
      - package: swift-dependencies
        product: Dependencies
      - package: swift-dependencies
        product: DependenciesMacros
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_NAME: Processing
        PRODUCT_MODULE_NAME: Processing
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  Export:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Core/Export/Sources/Export
    dependencies:
      - target: Models
      - target: Persistence
      - package: swift-tagged
        product: Tagged
      - package: swift-dependencies
        product: Dependencies
      - package: swift-dependencies
        product: DependenciesMacros
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_NAME: Export
        PRODUCT_MODULE_NAME: Export
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  Observability:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Core/Observability/Sources/Observability
    dependencies:
      - package: swift-dependencies
        product: Dependencies
      - package: swift-dependencies
        product: DependenciesMacros
    settings:
      base:
        PRODUCT_NAME: Observability
        PRODUCT_MODULE_NAME: Observability
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  Routing:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Core/Routing/Sources/Routing
    dependencies:
      - target: Models
      - package: swift-tagged
        product: Tagged
      - package: swift-url-routing
        product: URLRouting
      - package: swift-parsing
        product: Parsing
      - package: swift-case-paths
        product: CasePaths
    settings:
      base:
        PRODUCT_NAME: Routing
        PRODUCT_MODULE_NAME: Routing
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  DesignSystem:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Core/DesignSystem/Sources/DesignSystem
    settings:
      base:
        PRODUCT_NAME: DesignSystem
        PRODUCT_MODULE_NAME: DesignSystem
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  # Feature packages
  TimelineFeature:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Features/TimelineFeature/Sources/TimelineFeature
    dependencies:
      - target: Models
      - target: Persistence
      - target: DesignSystem
      - target: Processing
      - package: swift-tagged
        product: Tagged
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
    settings:
      base:
        PRODUCT_NAME: TimelineFeature
        PRODUCT_MODULE_NAME: TimelineFeature
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  RecordingFeature:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Features/RecordingFeature/Sources/RecordingFeature
    dependencies:
      - target: Models
      - target: Persistence
      - target: Audio
      - target: Processing
      - target: DesignSystem
      - target: SpeakerPickerFeature
      - package: swift-tagged
        product: Tagged
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
      - package: swift-clocks
        product: Clocks
    settings:
      base:
        PRODUCT_NAME: RecordingFeature
        PRODUCT_MODULE_NAME: RecordingFeature
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  SessionDetailFeature:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Features/SessionDetailFeature/Sources/SessionDetailFeature
    dependencies:
      - target: Models
      - target: Persistence
      - target: Processing
      - target: DesignSystem
      - target: Export
      - target: AudioPlayerFeature
      - target: SpeakerPickerFeature
      - package: swift-tagged
        product: Tagged
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
      - package: swift-perception
        product: Perception
    settings:
      base:
        PRODUCT_NAME: SessionDetailFeature
        PRODUCT_MODULE_NAME: SessionDetailFeature
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  PeopleFeature:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Features/PeopleFeature/Sources/PeopleFeature
    dependencies:
      - target: Models
      - target: Persistence
      - target: DesignSystem
      - package: swift-tagged
        product: Tagged
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
    settings:
      base:
        PRODUCT_NAME: PeopleFeature
        PRODUCT_MODULE_NAME: PeopleFeature
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  SpeakerPickerFeature:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Features/SpeakerPickerFeature/Sources/SpeakerPickerFeature
    dependencies:
      - target: Models
      - target: Persistence
      - target: DesignSystem
      - package: swift-tagged
        product: Tagged
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
    settings:
      base:
        PRODUCT_NAME: SpeakerPickerFeature
        PRODUCT_MODULE_NAME: SpeakerPickerFeature
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  AudioPlayerFeature:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Features/AudioPlayerFeature/Sources/AudioPlayerFeature
    dependencies:
      - target: Models
      - target: Audio
      - target: DesignSystem
      - package: swift-tagged
        product: Tagged
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
      - package: swift-perception
        product: Perception
      - package: swift-clocks
        product: Clocks
    settings:
      base:
        PRODUCT_NAME: AudioPlayerFeature
        PRODUCT_MODULE_NAME: AudioPlayerFeature
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  ProfileFeature:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Features/ProfileFeature/Sources/ProfileFeature
    dependencies:
      - target: Models
      - target: Persistence
      - target: DesignSystem
      - package: swift-tagged
        product: Tagged
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
    settings:
      base:
        PRODUCT_NAME: ProfileFeature
        PRODUCT_MODULE_NAME: ProfileFeature
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  PersonTimelineFeature:
    type: framework
    platform: iOS
    sources:
      - path: ../Packages/Features/PersonTimelineFeature/Sources/PersonTimelineFeature
    dependencies:
      - target: Models
      - target: Persistence
      - target: DesignSystem
      - target: TimelineFeature
      - package: swift-tagged
        product: Tagged
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-case-paths
        product: CasePaths
      - package: swift-dependencies
        product: Dependencies
    settings:
      base:
        PRODUCT_NAME: PersonTimelineFeature
        PRODUCT_MODULE_NAME: PersonTimelineFeature
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  # Test targets
  VaporTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../App/Tests/VaporTests
    dependencies:
      - target: Vapor
      - target: Audio
      - target: Models
      - target: Persistence
      - target: Processing
      - target: Routing
      - target: RecordingFeature
      - target: SessionDetailFeature
      - target: ProfileFeature
      - target: PersonTimelineFeature
      - package: swift-snapshot-testing
        product: SnapshotTesting
      - package: swift-composable-architecture
        product: ComposableArchitecture
      - package: swift-custom-dump
        product: CustomDump
      - package: swift-tagged
        product: Tagged
      - package: swift-dependencies
        product: Dependencies
      - package: swift-case-paths
        product: CasePaths
    settings:
      base:
        PRODUCT_NAME: VaporTests
        PRODUCT_MODULE_NAME: VaporTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vapor.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Vapor"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../App/Tests/SnapshotTests
    dependencies:
      - target: Vapor
      - package: swift-snapshot-testing
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_NAME: SnapshotTests
        PRODUCT_MODULE_NAME: SnapshotTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vapor.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Vapor"
        BUNDLE_LOADER: "$(TEST_HOST)"

  E2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../App/Tests/E2ETests
    dependencies:
      - target: Vapor
    settings:
      base:
        PRODUCT_NAME: E2ETests
        PRODUCT_MODULE_NAME: E2ETests
        TEST_TARGET_NAME: Vapor

schemes:
  Vapor:
    build:
      targets:
        Vapor: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VaporTests
        - SnapshotTests
        - E2ETests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
